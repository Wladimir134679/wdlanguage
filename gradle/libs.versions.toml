# Единый каталог версий для всей сборки.
# Правило проекта: сюда попадают только инструменты разработки (тесты, бенчмарки, тулинг).
# Рантайм-зависимостей у wdl-core нет и не будет — это проверяется задачей checkNoRuntimeDependencies.

[versions]
java = "21"
junit = "5.14.4"
# Модели и транспорт LSP. Живёт только в wdl-lsp: ни ядро, ни инструменты
# про протокол не знают и знать не должны.
lsp4j = "1.0.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
# Версии ниже приходят из BOM выше — намеренно не указаны.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }
# Модели и транспорт DAP — тот же выпуск lsp4j, отдельным артефактом. Живёт только
# в wdl-dap: ни ядро, ни отладчик про протокол не знают.
lsp4j-debug = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j.debug", version.ref = "lsp4j" }
