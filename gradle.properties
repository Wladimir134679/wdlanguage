# group и version подхватываются всеми проектами сборки автоматически
group=ru.wds.wdl
version=0.1.0-SNAPSHOT

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# UTF-8 везде: без этого русские сообщения об ошибках превращаются в кракозябры
# в консоли Windows (cp866).
systemProp.file.encoding=UTF-8
